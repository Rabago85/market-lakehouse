[project]
name = "market_lakehouse"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "boto3>=1.43.126",
    "dagster==1.13.29",
    "dagster-dbt>=0.29.29",
    "dbt-databricks>=1.7.9",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pandas-market-calendars>=5.5.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "market_lakehouse"
registry_modules = [
    "market_lakehouse.components.*",
]


